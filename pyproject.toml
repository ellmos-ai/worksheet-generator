[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "worksheet-generator"
version = "0.2.3"
description = "Fördermaterial-Generator für pädagogische und therapeutische Fachkräfte mit lokalem LLM-Agenten"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Lukas Geiger"}
]
keywords = [
    "education",
    "worksheet",
    "icf",
    "pedagogy",
    "therapy",
    "offline-first",
    "local-ai",
    "curriculum"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education"
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/worksheet-generator"
Documentation = "https://github.com/ellmos-ai/worksheet-generator#readme"
"German Documentation" = "https://github.com/ellmos-ai/worksheet-generator/blob/main/README_de.md"
Repository = "https://github.com/ellmos-ai/worksheet-generator.git"
Issues = "https://github.com/ellmos-ai/worksheet-generator/issues"
"LLM Context Index" = "https://github.com/ellmos-ai/worksheet-generator/blob/main/llms.txt"
"Third-Party Licenses" = "https://github.com/ellmos-ai/worksheet-generator/blob/main/THIRD_PARTY_LICENSES.md"
"Marketing Log" = "https://github.com/ellmos-ai/worksheet-generator/blob/main/MARKETING-LOG.txt"

[project.scripts]
worksheet-generator = "worksheet_generator.cli:main"

[project.optional-dependencies]
docx = ["python-docx>=1.1.0"]
test = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
include = ["worksheet_generator*"]

[tool.setuptools.package-data]
worksheet_generator = ["default_config.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

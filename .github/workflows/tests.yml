name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Run tests
      run: |
        pytest -v

  package:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Build distributions
      run: |
        python -m pip install --upgrade pip
        python -m pip install build
        python -m build

    - name: Smoke-test installed wheel outside checkout
      shell: bash
      run: |
        python -m venv "$RUNNER_TEMP/worksheet-smoke"
        SMOKE_PY="$RUNNER_TEMP/worksheet-smoke/bin/python"
        "$SMOKE_PY" -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
        cd "$RUNNER_TEMP"
        "$SMOKE_PY" -m worksheet_generator status | tee status.txt
        grep -F "eingebaut (Paketstandard)" status.txt
        "$SMOKE_PY" -m worksheet_generator generate \
          --freitext "CI-Smoke-Test" --no-icf --out worksheet.json
        "$SMOKE_PY" -m worksheet_generator render worksheet.json \
          --format md --out worksheet.md
        test -s worksheet.json
        test -s worksheet.md
